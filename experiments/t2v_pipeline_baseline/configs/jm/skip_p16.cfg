# JM syntax-ready state A1/A2: one I frame followed by P16x16 frames.
ProfileIDC               = 66
IntraPeriod              = 0
IDRPeriod                = 0
AdaptiveIntraPeriod      = 0
AdaptiveIDRPeriod        = 0
NumberBFrames            = 0
NumberReferenceFrames    = 1
PList0References         = 1
RateControlEnable        = 0
Transform8x8Mode         = 0
SymbolMode               = 0

# I picture: keep the already validated I16x16-only path.
DisableIntra4x4          = 1
DisableIntra16x16        = 0
EnableIPCM               = 0

# P pictures: non-skip P16x16 only, single reference, no intra fallback.
PSliceSkip               = 1
PSliceSearch16x16        = 1
PSliceSearch16x8         = 0
PSliceSearch8x16         = 0
PSliceSearch8x8          = 0
PSliceSearch8x4          = 0
PSliceSearch4x8          = 0
PSliceSearch4x4          = 0
DisableIntraInInter      = 1
EarlySkipEnable          = 0
SelectiveIntraEnable     = 0

PicInterlace             = 0
MbInterlace              = 0
GenerateMultiplePPS      = 0
RandomIntraMBRefresh     = 0
MbLineIntraUpdate        = 0
RDPictureDecision        = 0
# B1 uses a fixed transform/quantization backend. Enabling encoder-side RDO
# would reintroduce a coefficient-selection search that is intentionally absent.
RDOptimization           = 0
UseRDOQuant              = 0
AdaptiveRounding         = 0

# Keep reconstruction deterministic and avoid filter-side pixel dependencies.
DFParametersFlag         = 1
DFDisableRefISlice       = 1
DFDisableNRefISlice      = 1
DFDisableRefPSlice       = 1
DFDisableNRefPSlice      = 1
Verbose                  = 1
